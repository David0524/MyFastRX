<!doctype html>
<html><head><meta charset="utf-8"><title>MyFastRx static A</title>
<style>html,body{margin:0;background:#222}canvas{display:block;width:540px;height:675px}</style></head>
<body>
<script type="module">
const scene = await import('./scene.mjs');
const TL = await import('./timeline.mjs');
let out;
window.__init = async () => { const r = await scene.init(); return JSON.parse(JSON.stringify(r)); };
window.__render = async (t) => { out = await scene.render(t); return true; };
window.__meta = () => JSON.parse(JSON.stringify(scene.frameMeta()));
// send the current frame (raw RGBA) to the render server
window.__post = async (i) => {
  const d = out.getContext('2d').getImageData(0, 0, TL.W, TL.H).data;
  const r = await fetch('/frame?i=' + i, {method: 'POST', body: d});
  return r.status;
};
window.__png = () => out.toDataURL('image/png');
window.__ready = true;
</script>
</body></html>
