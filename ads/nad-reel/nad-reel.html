<!doctype html>
<meta charset="utf-8">
<title>MyFastRx NAD+ reel</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(92vw,405px);height:auto;background:#000;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="core.js"></script>
<script src="embedded.js"></script>
<script>
'use strict';
// ===================== BRIEF & BEAT SHEET =====================
// Subject: MyFastRx NAD+ social ad. A tired home-office worker takes the 3-minute online visit,
// a licensed provider reviews it, the kit ships free, and they feel steady again. Ends on the official logo + CTA.
// Format: 9:16, 1080x1920, drawn 12 fps, output 24 fps. Look: screen (flat shapes + fine dot grid), brand palette only.
// Anchor: the logo's heartbeat line is the floor line in every shot (HB_Y); it beats faster as the story lifts.
// Safe zone: text and key action inside x < 0.85W, 0.15H < y < 0.75H.
// t      dur   scene      camera                 what changes                                       sound
// 0.00   2.50  slump      push-in, drift down    3 p.m. clock, slumped at desk, steam; line sweep    muffled groove, whoosh 2.1
// 2.50   2.00  visit      push-in + tilt         phone form: 3 checks tick, progress, submit tap    groove opens up, 3 taps, tap
// 4.50   2.00  review     slow rise              provider card, check stamp lands                   stamp 5.4
// 6.50   2.00  delivery   pan down with the box  box drops to the doorstep, squash, flaps open, dive thump 7.2, whoosh 8.1
// 8.50   2.00  kit        rise                   vial + nasal spray rise out of the box             pops 8.7 / 8.9
// 10.50  2.75  energized  push-in, tilt up       sunlit, pose lifts neutral -> energized            -
// 13.25  2.25  price      float                  $99/mo, kit, CTA pill with tap                     tap 14.6
// 15.50  3.00  endcard    static logo            logo held still, CTA, url, disclaimer (2.9 s)      chime 15.5

// ===================== PALETTE =====================
const BLUE = '#1264FF', NAVY = '#07133D', ICE = '#F0F6FF', WHITE = '#FFFFFF';
usePalette(makePalette({
  paper: ICE, paperBand: null, ink: NAVY, night: NAVY, chalk: ICE, chalkDim: mix(ICE, NAVY, .45), guide: alpha(BLUE, .35),
  fills: [BLUE, NAVY, WHITE, '#F2B48A', '#6A3E27', '#C8661F'], shade: mix(NAVY, BLUE, .2), light: WHITE, blush: '#DE9868',
  accents: [BLUE, tint(BLUE, .45), NAVY, WHITE], inks: [BLUE, NAVY], finish: 'screen',
}, 'screenSea'));
// named tones, all derived from PAL
const C = {
  blue: PAL.fills[0], navy: PAL.fills[1], white: PAL.fills[2], ice: PAL.paper,
  skin: PAL.fills[3], skinSh: PAL.blush, hair: PAL.fills[4], hairSh: shade(PAL.fills[4], .28),
  amber: PAL.fills[5], amberSh: shade(PAL.fills[5], .3), amberHi: tint(PAL.fills[5], .35),
  sweater: mix(PAL.fills[1], PAL.fills[0], .2), sweaterSh: PAL.fills[1],
  trouser: mix(PAL.paper, PAL.fills[0], .13), trouserSh: mix(PAL.paper, PAL.fills[0], .26),
  pale: mix(PAL.paper, PAL.fills[0], .22), mid: mix(PAL.paper, PAL.fills[0], .4), deep: mix(PAL.fills[0], PAL.fills[1], .35),
  line: alpha(PAL.fills[1], .28),
};
const HB_Y = 1400;                                 // the anchor: heartbeat floor line, bottom of the safe zone
const TX = 84;                                     // text left edge; right edge must stay < 0.85 W

// ===================== HELPERS =====================
const backOut = t => { const s = 1.7; t -= 1; return 1 + (s + 1) * t * t * t + s * t * t; };
function capsule(A, B, w) { const p = new Path2D(), a = Math.atan2(B[1] - A[1], B[0] - A[0]), r = w / 2; p.arc(A[0], A[1], r, a + Math.PI / 2, a + Math.PI * 1.5); p.arc(B[0], B[1], r, a - Math.PI / 2, a + Math.PI / 2); p.closePath(); return p; }
function capsulePts(A, B, w, n = 9) { const a = Math.atan2(B[1] - A[1], B[0] - A[0]), r = w / 2, pts = [];
  for (let k = 0; k <= n; k++) { const t = a + Math.PI / 2 + k / n * Math.PI; pts.push([A[0] + Math.cos(t) * r, A[1] + Math.sin(t) * r]); }
  for (let k = 0; k <= n; k++) { const t = a - Math.PI / 2 + k / n * Math.PI; pts.push([B[0] + Math.cos(t) * r, B[1] + Math.sin(t) * r]); } return pts; }
const boxOf = (A, B, w) => [Math.min(A[0], B[0]) - w, Math.min(A[1], B[1]) - w, Math.abs(A[0] - B[0]) + 2 * w, Math.abs(A[1] - B[1]) + 2 * w];
function rrPts(x, y, w, h, r, n = 5) { const pts = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let k = 0; k <= n; k++) { const a = a0 + k / n * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return pts; }
// flat part: fill, a two-tone shade block offset toward the light-away side, fine dot screen, optional thin outline
function part(c, path, box, fill, sh, o = {}) {
  c.fillStyle = fill; c.fill(path);
  if (sh) { c.save(); c.clip(path); c.translate(o.dx ?? -box[2] * .42, o.dy ?? 0); c.fillStyle = sh; c.fill(path); c.restore(); }
  if (o.dots !== false) surface(c, path, box, { finish: 'screen', color: o.dotCol || (sh || shade(fill, .2)), density: o.dens ?? .09, cell: 7, alpha: .55, seed: o.seed || 3 });
  if (o.pts) { c.save(); c.strokeStyle = o.lineCol || C.line; c.lineWidth = o.lw || 1.8; c.lineJoin = 'round'; wob(c, o.pts, 1.4, (o.seed || 3) + 9, true); c.restore(); }
}
function ik(S, T, L1, L2, bend) { let dx = T[0] - S[0], dy = T[1] - S[1], d = Math.hypot(dx, dy); const dm = L1 + L2 - 1; if (d > dm) { dx *= dm / d; dy *= dm / d; d = dm; }
  const a = Math.atan2(dy, dx), th = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1)), e = a + bend * th; const E = [S[0] + Math.cos(e) * L1, S[1] + Math.sin(e) * L1]; return [E, [S[0] + dx, S[1] + dy]]; }
const seg = (A, a, L) => [A[0] + Math.sin(a) * L, A[1] + Math.cos(a) * L];
const lerpPt = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

// ---------- text ----------
function setFont(c, size, w = 800) { c.font = `${w} ${size}px Pop`; }
function richLine(c, segs, x, y, size, w = 800, align = 'left') { setFont(c, size, w); c.textBaseline = 'alphabetic';
  const ws = segs.map(s => c.measureText(s[0]).width), tot = ws.reduce((a, b) => a + b, 0); let px = align === 'center' ? x - tot / 2 : x;
  segs.forEach((s, k) => { c.fillStyle = alpha(C.blue, .22); c.fillText(s[0], px + 4, y + 4); c.fillStyle = s[1]; c.fillText(s[0], px, y); px += ws[k]; }); return tot; }
// lines: [[segs, size, weight]]; each line pops in 2 drawn frames after the previous
function headline(c, tau, t0, lines, o = {}) { const { x = TX, y = 360, gap = 1.12, align = 'left', stagger = 1 / 6 } = o; let yy = y;
  let prev = 0; lines.forEach(([segs, size, w = 800, dy = 0], k) => { yy += (k ? (prev + size) / 2 * gap : size * .8) + dy; prev = size; const p = sm(t0 + k * stagger, t0 + k * stagger + .25, tau, t => t); if (p <= 0) return;
    const s = lerp(.8, 1, backOut(p)); c.save(); resetT(c); c.globalAlpha = clamp(p * 1.8, 0, 1); c.translate(x, yy); c.scale(s, s); c.translate(-x, -yy); richLine(c, segs, x, yy, size, w, align); c.restore(); }); }
function pill(c, x, y, w, h, label, p = 1, press = 0) { if (p <= 0) return; const s = lerp(.7, 1, backOut(clamp(p, 0, 1))) * (1 - press * .06);
  c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = clamp(p * 1.8, 0, 1);
  c.fillStyle = C.navy; c.fill(roundRectPath(-w / 2 + 6, -h / 2 + 10, w, h, h / 2));
  const body = roundRectPath(-w / 2, -h / 2, w, h, h / 2); c.fillStyle = C.blue; c.fill(body);
  dotScreen(c, body, [-w / 2, -h / 2, w, h], { cell: 7, color: C.deep, density: .06, alpha: .5, seed: 71 });
  setFont(c, h * .4, 800); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = C.white; c.fillText(label, 0, 3); c.restore(); }

// ---------- backdrop and anchor ----------
function backdrop(c, tau, o = {}) { const { speed = 36, seed = 1, drift = 0, shapes = 11 } = o; paper(c, PAL.paper, null, seed);
  resetT(c); const g = 44, off = (tau * speed) % g; c.fillStyle = alpha(C.blue, .09); c.beginPath();
  for (let y = -g; y < H + g; y += g) for (let x = 0; x < W + g; x += g) { const yy = y - off, xx = x + ((y / g) % 2 ? g / 2 : 0) - (tau * drift) % g; c.moveTo(xx + 2.4, yy); c.arc(xx, yy, 2.4, 0, TAU); }
  c.fill();
  const r = rng(seed * 17); c.lineCap = 'round';
  for (let k = 0; k < shapes; k++) { const depth = .5 + r() * 1.2, x = r() * W, y0 = r() * (H + 400), y = ((y0 - tau * speed * depth * 2.2) % (H + 400) + H + 400) % (H + 400) - 200, s = 10 + depth * 12;
    c.strokeStyle = alpha(k % 3 ? C.blue : C.navy, .10 + depth * .05); c.lineWidth = 3 + depth * 2;
    if (k % 2) { c.beginPath(); c.moveTo(x - s, y); c.lineTo(x + s, y); c.moveTo(x, y - s); c.lineTo(x, y + s); c.stroke(); }
    else { c.beginPath(); c.arc(x, y, s, 0, TAU); c.stroke(); } } }
const HB_SHAPE = [[-64, 0], [-48, -.3], [-37, .1], [-27, 0], [-15, -1], [0, .44], [12, 0]];
function heartbeat(c, tau, o = {}) { const { y = HB_Y, amp = 70, speed = 300, period = 560, color = C.blue, width = 11, x0 = -60, x1 = W + 60, phase = 120, from = x0, to = x1, screen = false } = o;
  const pts = [[from, y]], shift = tau * speed, n = Math.ceil((x1 - x0) / period) + 1, span = n * period;
  for (let k = 0; k < n; k++) { const pc = x0 + (((k * period - shift + phase) % span) + span) % span;
    for (const [du, dv] of HB_SHAPE) { const x = pc + du; if (x > from && x < to) pts.push([x, y + dv * amp]); } }
  pts.push([to, y]); pts.sort((a, b) => a[0] - b[0]);
  c.save(); if (screen) resetT(c); c.strokeStyle = color; c.lineWidth = width; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath(); pts.forEach((p, k) => k ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); c.restore(); }
function groundShadow(c, x, y, rx, ry = 14) { c.save(); c.fillStyle = alpha(C.blue, .16); c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); c.restore(); }

// ===================== PUPPET: the customer =====================
// Local coords: origin at the hip centre, up = -y, ~690 tall at scale 1. Pose: lean, tilt, eyes, smile, hands (IK targets), legs.
const L = { thigh: 150, shin: 146, upper: 118, fore: 106 };
const SH_F = [52, -196], SH_B = [-58, -196], NECK = [4, -228];
function headPoint(pose, p) { const a = pose.tilt || 0, x = p[0], y = p[1]; return [NECK[0] + x * Math.cos(a) - y * Math.sin(a), NECK[1] + x * Math.sin(a) + y * Math.cos(a)]; }
const POSES = {
  neutral:   { lean: 0, tilt: 0, eyes: 1, smile: .45, brow: 0, hf: [74, -118], bf: -1, hb: [-74, 6], bb: 1, mug: 'f', legs: [[.03, 0], [-.05, -.02]] },
  energized: { lean: -.03, tilt: -.06, eyes: 1, smile: 1, brow: -.4, hf: [70, -6], bf: -1, hb: [-128, -372], bb: -1, mug: 'b', legs: [[.05, 0], [-.07, -.02]] },
  tired:     { lean: .2, tilt: .3, eyes: .22, smile: -.5, brow: .6, hf: null, bf: -1, hb: [190, -112], bb: 1, mug: null, legs: [[1.45, .06], [1.38, .12]], seated: true },
};
function blendPose(a, b, t) { const o = { ...(t < .5 ? a : b) }; for (const k of ['lean', 'tilt', 'eyes', 'smile', 'brow']) o[k] = lerp(a[k], b[k], t);
  o.hf = lerpPt(a.hf, b.hf, t); o.hb = lerpPt(a.hb, b.hb, t); o.legs = a.legs.map((l, k) => [lerp(l[0], b.legs[k][0], t), lerp(l[1], b.legs[k][1], t)]); return o; }
function drawLeg(c, pose, k, seed) { const hip = [k ? -30 : 34, 0], [a1, a2] = pose.legs[k], knee = seg(hip, a1, L.thigh), ank = seg(knee, a2, L.shin);
  const col = k ? mix(C.trouser, C.trouserSh, .45) : C.trouser, sh = k ? C.trouserSh : mix(C.trouser, C.trouserSh, .75);
  part(c, capsule(hip, knee, 64), boxOf(hip, knee, 64), col, sh, { dx: -18, seed: seed + 1 });
  part(c, capsule(knee, ank, 54), boxOf(knee, ank, 54), col, sh, { dx: -16, seed: seed + 2 });
  // shoe points forward (+x)
  const sx = ank[0] - 24, sy = ank[1] + 2, sp = roundRectPath(sx, sy - 14, 84, 34, [18, 22, 14, 12]);
  part(c, sp, [sx, sy - 14, 84, 34], C.white, null, { dots: false, pts: rrPts(sx, sy - 14, 84, 34, 14), seed: seed + 3 });
  c.fillStyle = C.pale; c.fillRect(sx + 4, sy + 14, 78, 6);
  c.strokeStyle = C.mid; c.lineWidth = 2.4; c.lineCap = 'round'; for (let q = 0; q < 3; q++) { c.beginPath(); c.moveTo(sx + 30 + q * 11, sy - 8); c.lineTo(sx + 40 + q * 11, sy - 3); c.stroke(); } }
function drawMug(c, x, y, s = 1, seed = 1) { c.save(); c.translate(x, y); c.scale(s, s);
  c.strokeStyle = C.white; c.lineWidth = 9; c.beginPath(); c.arc(-26, 2, 13, Math.PI * .5, Math.PI * 1.5); c.stroke();
  c.strokeStyle = C.line; c.lineWidth = 1.6; c.beginPath(); c.arc(-26, 2, 18, Math.PI * .5, Math.PI * 1.5); c.stroke();
  const b = roundRectPath(-24, -28, 50, 58, [4, 4, 10, 10]); part(c, b, [-24, -28, 50, 58], C.white, mix(C.white, C.trouser, .8), { dx: -30, dots: false, pts: rrPts(-24, -28, 50, 58, 5), seed });
  c.fillStyle = C.trouser; c.beginPath(); c.ellipse(1, -27, 24, 5, 0, 0, TAU); c.fill(); c.restore(); }
function drawArm(c, pose, which, seed) { const front = which === 'f', S0 = front ? SH_F : SH_B;
  let T = front ? pose.hf : pose.hb; if (!T) T = headPoint(pose, [36, -18]);   // tired: hand on the cheek
  const [E, Wr] = ik(S0, T, L.upper, L.fore, front ? pose.bf : pose.bb);
  const col = front ? C.sweater : mix(C.sweater, C.sweaterSh, .45), sh = C.sweaterSh;
  const mugHere = pose.mug === which;
  if (mugHere && which === 'b') drawMug(c, Wr[0] + 8, Wr[1] - 16, 1, seed + 40);
  part(c, capsule(S0, E, 50), boxOf(S0, E, 50), col, sh, { dx: -16, seed: seed + 5 });
  const a = Math.atan2(Wr[1] - E[1], Wr[0] - E[0]), cuffA = [Wr[0] - Math.cos(a) * 16, Wr[1] - Math.sin(a) * 16];
  part(c, capsule(E, cuffA, 44), boxOf(E, cuffA, 44), col, sh, { dx: -14, seed: seed + 6 });
  c.fillStyle = C.white; c.fill(capsule(cuffA, [Wr[0] - Math.cos(a) * 6, Wr[1] - Math.sin(a) * 6], 40));
  if (mugHere && which === 'f') drawMug(c, Wr[0] + 18, Wr[1] - 4, 1, seed + 40);
  const hp = ellPath(Wr[0] + Math.cos(a) * 12, Wr[1] + Math.sin(a) * 12, 21, 18, a); part(c, hp, [Wr[0] - 30, Wr[1] - 30, 60, 60], C.skin, C.skinSh, { dx: -8, dy: 4, dots: false }); }
function drawHead(c, pose, seed) { c.save(); c.translate(NECK[0], NECK[1]); c.rotate(pose.tilt || 0);
  const neck = roundRectPath(-17, -30, 34, 44, 8); part(c, neck, [-17, -30, 34, 44], C.skinSh, null, { dots: false });
  const ear = ellPath(-38, -66, 12, 17); part(c, ear, [-50, -83, 24, 34], C.skin, C.skinSh, { dx: 6, dots: false });
  const face = ellPath(10, -74, 54, 64); part(c, face, [-44, -138, 108, 128], C.skin, C.skinSh, { dx: -72, dy: 0, dots: false, pts: ellPts(10, -74, 54, 64, 0, 40), lineCol: alpha(C.skinSh, .8), lw: 1.4 });
  const hairPts = [[-54, -56], [-58, -96], [-44, -130], [-12, -148], [24, -150], [52, -138], [66, -114], [60, -104], [44, -114], [22, -112], [4, -106], [-14, -104], [-22, -94], [-30, -74], [-34, -52]];
  const hair = polyPath(hairPts); part(c, hair, [-60, -152, 130, 104], C.hair, C.hairSh, { dx: -44, dy: 10, dots: false });
  c.fillStyle = C.hairSh; c.fill(polyPath([[20, -148], [44, -128], [30, -124], [10, -136]]));
  // features: eyes are dots, tired eyes get a lid
  const eo = clamp(pose.eyes, 0, 1);
  for (const ex of [26, 50]) { c.fillStyle = C.navy; c.beginPath(); c.ellipse(ex, -76, 5.6, 6.4 * lerp(.35, 1, eo), 0, 0, TAU); c.fill();
    if (eo < .6) { c.strokeStyle = C.navy; c.lineWidth = 2.6; c.lineCap = 'round'; c.beginPath(); c.moveTo(ex - 8, -79); c.lineTo(ex + 7, -78); c.stroke(); } }
  c.strokeStyle = C.hairSh; c.lineWidth = 4; c.lineCap = 'round'; const b = pose.brow || 0;
  for (const ex of [26, 50]) { c.beginPath(); c.moveTo(ex - 9, -94 + (ex < 40 ? b * 3 : -b * 3)); c.lineTo(ex + 8, -95 - (ex < 40 ? b * 2 : -b * 2) + b * 2); c.stroke(); }
  c.strokeStyle = C.skinSh; c.lineWidth = 3; c.beginPath(); c.moveTo(58, -76); c.lineTo(66, -58); c.lineTo(56, -55); c.stroke();
  const sm_ = pose.smile; c.strokeStyle = shade(C.skinSh, .35); c.lineWidth = 3.4; c.beginPath(); c.moveTo(28, -40 - sm_ * 2); c.quadraticCurveTo(40, -40 + sm_ * 9, 52, -42 - sm_ * 3); c.stroke();
  c.restore(); }
function drawTorso(c, pose, seed) {
  const sw = new Path2D(); sw.moveTo(-40, -230); sw.quadraticCurveTo(-84, -224, -86, -186); sw.lineTo(-76, 8); sw.lineTo(78, 8); sw.lineTo(84, -186); sw.quadraticCurveTo(80, -224, 44, -230); sw.quadraticCurveTo(4, -206, -40, -230); sw.closePath();
  part(c, sw, [-90, -234, 176, 246], C.sweater, C.sweaterSh, { dx: -120, seed: seed + 20, dens: .1 });
  c.fillStyle = C.sweaterSh; c.fillRect(-76, -12, 154, 20);
  const col = polyPath([[-36, -232], [-12, -206], [2, -218], [16, -206], [40, -232], [26, -240], [2, -226], [-22, -240]]); c.fillStyle = C.white; c.fill(col);
  c.strokeStyle = C.line; c.lineWidth = 1.4; wob(c, [[-36, -232], [-12, -206], [2, -218], [16, -206], [40, -232]], 1, seed + 21); }
// parts: 'all' | 'body' (legs, torso, head, no arms) | 'arms'
function drawPerson(c, x, y, s, pose, seed, parts = 'all') { c.save(); c.translate(x, y); c.scale(s, s); c.lineJoin = 'round';
  if (parts !== 'arms') { drawLeg(c, pose, 1, seed + 100); drawLeg(c, pose, 0, seed + 200); }
  c.save(); c.rotate(pose.lean);
  if (parts === 'all') drawArm(c, pose, 'b', seed + 300);
  if (parts !== 'arms') { drawTorso(c, pose, seed); c.save(); c.translate(0, 0); drawHead(c, pose, seed); c.restore(); }
  if (parts === 'arms') drawArm(c, pose, 'b', seed + 300);
  if (parts !== 'body') drawArm(c, pose, 'f', seed + 400);
  c.restore(); c.restore(); }

// ===================== PROPS =====================
function drawVial(c, x, y, s = 1, seed = 1) { c.save(); c.translate(x, y); c.scale(s, s);   // origin at bottom centre
  groundShadow(c, 0, 0, 96, 12);
  const body = roundRectPath(-82, -210, 164, 210, [26, 26, 22, 22]); part(c, body, [-82, -210, 164, 210], C.amber, C.amberSh, { dx: -120, dots: true, dotCol: C.amberSh, dens: .08, seed });
  c.fillStyle = alpha(C.amberHi, .9); c.fill(roundRectPath(44, -190, 14, 150, 7));
  const lab = rectPath(-82, -150, 164, 96); c.fillStyle = C.white; c.fill(lab); c.fillStyle = C.trouser; c.fillRect(-82, -150, 34, 96);
  setFont(c, 44, 800); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = C.navy; c.fillText('NAD+', 4, -100);
  const cap = roundRectPath(-90, -270, 180, 66, 10); part(c, cap, [-90, -270, 180, 66], C.navy, shade(C.navy, .4), { dx: -120, dots: false });
  c.fillStyle = mix(C.navy, C.blue, .3); c.fillRect(-90, -262, 180, 10); c.strokeStyle = alpha(C.blue, .35); c.lineWidth = 3; for (let k = -80; k <= 80; k += 16) { c.beginPath(); c.moveTo(k, -248); c.lineTo(k, -210); c.stroke(); }
  c.restore(); }
